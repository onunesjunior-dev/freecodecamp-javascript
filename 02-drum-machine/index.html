<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPC-9000 // Studio Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-container">
      <div id="drum-machine">
        <header class="machine-header">
          <div class="brand">
            <span class="logo-badge">NUNES AUDIO</span>
            <span class="model-name">MPC-9000 // PRO SAMPLER</span>
          </div>
          <div class="display-container">
            <div class="display-label">CURRENT PAD</div>
            <p id="display">PRONTO</p>
          </div>
        </header>

        <div id="pad-bank">
          <!-- Linha 1: Q, W, E -->
          <button class="drum-pad" id="Heater-1">
            Q
            <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Heater-2">
            W
            <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Heater-3">
            E
            <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" preload="auto"></audio>
          </button>

          <!-- Linha 2: A, S, D -->
          <button class="drum-pad" id="Heater-4">
            A
            <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Clap">
            S
            <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Open-HH">
            D
            <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" preload="auto"></audio>
          </button>

          <!-- Linha 3: Z, X, C -->
          <button class="drum-pad" id="Kick-n-Hat">
            Z
            <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Kick">
            X
            <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" preload="auto"></audio>
          </button>
          <button class="drum-pad" id="Closed-HH">
            C
            <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" preload="auto"></audio>
          </button>
        </div>

        <footer class="machine-footer">
          <span class="status-led"></span>
          <span>SISTEMA PRONTO // 44.1 kHz 16-BIT</span>
        </footer>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
